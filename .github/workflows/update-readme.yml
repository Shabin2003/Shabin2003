name: Update README

on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python update_readme.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "Update project list" && git push; }
      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-readme.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
